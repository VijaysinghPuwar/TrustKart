spring:
  application:
    name: trustkart
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${TRUSTKART_DB_URL:jdbc:postgresql://localhost:5433/trustkart}
    username: ${TRUSTKART_DB_USER:trustkart}
    password: ${TRUSTKART_DB_PASSWORD}
    hikari:
      maximum-pool-size: ${TRUSTKART_DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        default_batch_fetch_size: 50
  flyway:
    locations: classpath:db/migration
  data:
    redis:
      host: ${TRUSTKART_REDIS_HOST:localhost}
      port: ${TRUSTKART_REDIS_PORT:6380}
      password: ${TRUSTKART_REDIS_PASSWORD:}
  jackson:
    deserialization:
      # Reject unknown JSON fields: a client cannot smuggle "price" or "role" into a request.
      fail-on-unknown-properties: true
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: ${PORT:8080}
  shutdown: graceful
  # Tomcat's RemoteIpValve only honours X-Forwarded-For from internal proxies (private ranges by default),
  # so clients can't spoof their IP to dodge rate limits.
  forward-headers-strategy: native
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      roles: ADMIN
      probes:
        enabled: true
  info:
    env:
      enabled: false

springdoc:
  api-docs:
    enabled: ${TRUSTKART_API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${TRUSTKART_API_DOCS_ENABLED:false}

logging:
  pattern:
    correlation: "[%X{requestId:-}] "

trustkart:
  auth:
    jwt-secret: ${TRUSTKART_JWT_SECRET}
    access-token-ttl: PT10M
    refresh-token-ttl: P14D
    secure-cookies: ${TRUSTKART_SECURE_COOKIES:true}
    max-failed-logins: 5
    lock-duration: PT15M
  cors:
    allowed-origins: ${TRUSTKART_ALLOWED_ORIGINS:http://localhost:5173}
  demo:
    seed-catalog: ${TRUSTKART_SEED_CATALOG:false}

---
spring:
  config:
    activate:
      on-profile: dev
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
trustkart:
  auth:
    # Plain-http localhost only. Every other profile keeps Secure cookies.
    secure-cookies: false
  demo:
    seed-catalog: true

---
spring:
  config:
    activate:
      on-profile: prod
logging:
  structured:
    format:
      console: ecs
