spring:
  application:
    name: trustkart
  threads:
    virtual:
      enabled: true
  datasource:
    # Either a full JDBC URL, or host / port / database separately (how Render hands out its database details).
    url: ${TRUSTKART_DB_URL:jdbc:postgresql://${TRUSTKART_DB_HOST:localhost}:${TRUSTKART_DB_PORT:5433}/${TRUSTKART_DB_NAME:trustkart}}
    username: ${TRUSTKART_DB_USER:trustkart}
    password: ${TRUSTKART_DB_PASSWORD}
    hikari:
      maximum-pool-size: ${TRUSTKART_DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        default_batch_fetch_size: 50
  flyway:
    locations: classpath:db/migration
  data:
    redis:
      host: ${TRUSTKART_REDIS_HOST:localhost}
      port: ${TRUSTKART_REDIS_PORT:6380}
      username: ${TRUSTKART_REDIS_USERNAME:}
      password: ${TRUSTKART_REDIS_PASSWORD:}
      # Hosted Redis (e.g. Upstash) requires TLS.
      ssl:
        enabled: ${TRUSTKART_REDIS_SSL:false}
  jackson:
    deserialization:
      # Reject unknown JSON fields: a client cannot smuggle "price" or "role" into a request.
      fail-on-unknown-properties: true
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: ${PORT:8080}
  shutdown: graceful
  # Tomcat's RemoteIpValve only honours X-Forwarded-For from internal proxies (private ranges by default),
  # so clients can't spoof their IP to dodge rate limits.
  forward-headers-strategy: native
  tomcat:
    remoteip:
      # Proxies whose X-Forwarded-* headers are believed. Defaults to private ranges; a hosted deployment behind an
      # edge proxy sets TRUSTKART_TRUSTED_PROXIES to that proxy's address pattern (see docs/DEPLOYMENT.md).
      internal-proxies: ${TRUSTKART_TRUSTED_PROXIES:10\.\d{1,3}\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}|169\.254\.\d{1,3}\.\d{1,3}|127\.\d{1,3}\.\d{1,3}\.\d{1,3}|100\.6[4-9]\.\d{1,3}\.\d{1,3}|100\.[7-9]\d\.\d{1,3}\.\d{1,3}|100\.1[0-1]\d\.\d{1,3}\.\d{1,3}|100\.12[0-7]\.\d{1,3}\.\d{1,3}|172\.1[6-9]\.\d{1,3}\.\d{1,3}|172\.2\d\.\d{1,3}\.\d{1,3}|172\.3[0-1]\.\d{1,3}\.\d{1,3}|0:0:0:0:0:0:0:1|::1}
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never

management:
  health:
    # Redis is optional (rate limits fail open, sessions fall back to the database), so an outage mustn't mark the
    # whole service unhealthy and get it pulled from the load balancer.
    redis:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      roles: ADMIN
      probes:
        enabled: true
  info:
    env:
      enabled: false

springdoc:
  api-docs:
    enabled: ${TRUSTKART_API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${TRUSTKART_API_DOCS_ENABLED:false}

logging:
  pattern:
    correlation: "[%X{requestId:-}] "

trustkart:
  auth:
    jwt-secret: ${TRUSTKART_JWT_SECRET}
    access-token-ttl: PT10M
    refresh-token-ttl: P14D
    secure-cookies: ${TRUSTKART_SECURE_COOKIES:true}
    max-failed-logins: 5
    lock-duration: PT15M
  oauth:
    google:
      # Leave empty to run without Google sign-in. Redirect URI to register in Google Cloud Console:
      # <frontend origin>/api/v1/auth/oauth2/callback/google
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
  # The origin browsers use, e.g. https://trustkart.vercel.app. Pins the Google sign-in callback when the API is
  # reached through a hosting proxy. Empty locally.
  public-origin: ${TRUSTKART_PUBLIC_ORIGIN:}
  cors:
    allowed-origins: ${TRUSTKART_ALLOWED_ORIGINS:http://localhost:5173}
  demo:
    seed-catalog: ${TRUSTKART_SEED_CATALOG:false}

---
spring:
  config:
    activate:
      on-profile: dev
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
trustkart:
  auth:
    # Plain-http localhost only. Every other profile keeps Secure cookies.
    secure-cookies: false
  demo:
    seed-catalog: true

---
spring:
  config:
    activate:
      on-profile: prod
logging:
  structured:
    format:
      console: ecs
