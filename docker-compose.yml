# Local development stack. Secrets come from .env (copy .env.example); nothing here is used in production.
name: trustkart

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: trustkart
      POSTGRES_USER: ${TRUSTKART_DB_USER:-trustkart}
      POSTGRES_PASSWORD: ${TRUSTKART_DB_PASSWORD:?set TRUSTKART_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${TRUSTKART_DB_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d trustkart"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--requirepass", "${TRUSTKART_REDIS_PASSWORD:?set TRUSTKART_REDIS_PASSWORD in .env}", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${TRUSTKART_REDIS_HOST_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${TRUSTKART_REDIS_PASSWORD}

  backend:
    build: ./backend
    profiles: ["app"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      TRUSTKART_DB_URL: jdbc:postgresql://postgres:5432/trustkart
      TRUSTKART_DB_USER: ${TRUSTKART_DB_USER:-trustkart}
      TRUSTKART_DB_PASSWORD: ${TRUSTKART_DB_PASSWORD}
      TRUSTKART_REDIS_HOST: redis
      TRUSTKART_REDIS_PASSWORD: ${TRUSTKART_REDIS_PASSWORD}
      TRUSTKART_JWT_SECRET: ${TRUSTKART_JWT_SECRET:?set TRUSTKART_JWT_SECRET in .env}
      TRUSTKART_ALLOWED_ORIGINS: ${TRUSTKART_ALLOWED_ORIGINS:-http://localhost:5173}
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness | grep -q UP"]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 30s

volumes:
  pgdata:
