# Render Blueprint: the TrustKart API and its PostgreSQL database, wired together. Redis is the workspace's existing
# free Key Value instance (Render allows one per workspace); every TrustKart key starts with "tk:", so it can share.
# Dashboard → New → Blueprint → pick this repository → Apply. No secrets to type: Render connects the pieces.
# The website itself is on Vercel; vercel.json forwards /api/* to the API service below.
databases:
  - name: trustkart-db
    plan: free            # free Render Postgres expires after 30 days; upgrade or move it before then
    region: oregon
    postgresMajorVersion: "17"
    databaseName: trustkart
    user: trustkart
    ipAllowList: []       # reachable only from Render services, never from the internet

services:
  - type: web
    name: trustkart-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /actuator/health/liveness
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Tuned for the free plan's 512 MB: tested with the full catalog seeded and a 40-shopper stress test
      # (about 420 MB used, no out-of-memory).
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=60 -XX:+UseSerialGC -Xss512k -XX:ReservedCodeCacheSize=64m -XX:MaxMetaspaceSize=192m -XX:+ExitOnOutOfMemoryError
      - key: TRUSTKART_DB_HOST
        fromDatabase: { name: trustkart-db, property: host }
      - key: TRUSTKART_DB_PORT
        fromDatabase: { name: trustkart-db, property: port }
      - key: TRUSTKART_DB_NAME
        fromDatabase: { name: trustkart-db, property: database }
      - key: TRUSTKART_DB_USER
        fromDatabase: { name: trustkart-db, property: user }
      - key: TRUSTKART_DB_PASSWORD
        fromDatabase: { name: trustkart-db, property: password }
      - key: TRUSTKART_DB_POOL_SIZE
        value: "5"
      - key: TRUSTKART_REDIS_HOST
        fromService: { type: keyvalue, name: manga-recap-redis, property: host }
      - key: TRUSTKART_REDIS_PORT
        fromService: { type: keyvalue, name: manga-recap-redis, property: port }
      # Signs login tokens; Render generates a random value once.
      - key: TRUSTKART_JWT_SECRET
        generateValue: true
      # The address people visit. Pins the Google sign-in callback and allows the site to call the API.
      - key: TRUSTKART_PUBLIC_ORIGIN
        value: https://trustkart-xi.vercel.app
      - key: TRUSTKART_ALLOWED_ORIGINS
        value: https://trustkart-xi.vercel.app
      # Loads the 1,192-product catalog on first start; safe to leave on (it never duplicates).
      - key: TRUSTKART_SEED_CATALOG
        value: "true"
      # Optional: Google sign-in. Leave empty to hide the Google button.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
