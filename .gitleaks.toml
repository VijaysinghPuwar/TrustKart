title = "TrustKart gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Documented placeholders and the weak-password denylist, not secrets"
regexes = ['''change-me-[a-z0-9-]+''', '''correct-horse-battery-staple-42''']  # the second is a test-only password
paths = [
  '''\.env\.example$''',
  '''frontend/package-lock\.json$''',
  # Well-known weak passwords the app refuses; flagged as generic keys by entropy.
  '''auth/application/PasswordPolicy\.java$''',
]
