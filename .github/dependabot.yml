version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      spring:
        patterns: ["org.springframework*", "io.spring*"]
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      dev-tooling:
        dependency-type: development
        # Major tooling upgrades (ESLint, TypeScript) need their plugins to catch up; do those by hand.
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
  - package-ecosystem: docker
    directory: /backend
    schedule: { interval: monthly }
    # Stay on the Java LTS line the tests run on; move to the next LTS deliberately.
    ignore:
      - dependency-name: eclipse-temurin
        update-types: ["version-update:semver-major"]
