name: Keep API warm

# Render's free plan puts the API to sleep after 15 minutes without traffic, and waking it takes about a minute.
# A light health check every 10 minutes keeps the live demo responsive. Delete this file (or disable the
# workflow in the Actions tab) to let the API sleep again.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Health check
        run: |
          for attempt in 1 2 3; do
            if curl -fsS --max-time 90 https://trustkart-api-2ufo.onrender.com/actuator/health/liveness; then
              exit 0
            fi
            sleep 10
          done
          echo "API did not answer after 3 attempts" >&2
          exit 1
