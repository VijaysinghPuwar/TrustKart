name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build, unit + Testcontainers integration tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify
        run: ./mvnw -B -ntp verify
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports
            backend/target/failsafe-reports

  frontend:
    name: Frontend (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - name: Audit production dependencies (high and critical only)
        run: npm audit --omit=dev --audit-level=high

  e2e:
    name: End-to-end (Playwright against a local stack)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 25
    # Throwaway PostgreSQL and Redis that exist only for this job; nothing here reaches a hosted service.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: trustkart
          POSTGRES_USER: trustkart
          POSTGRES_PASSWORD: change-me-ci-database
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U trustkart -d trustkart" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:8-alpine
        ports: ['6380:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TRUSTKART_DB_URL: jdbc:postgresql://localhost:5433/trustkart
      TRUSTKART_DB_USER: trustkart
      TRUSTKART_DB_PASSWORD: change-me-ci-database
      TRUSTKART_REDIS_HOST: localhost
      TRUSTKART_REDIS_PORT: '6380'
      SPRING_PROFILES_ACTIVE: dev # seeds the demo catalog; cookies are not Secure on plain-http localhost
      TRUSTKART_ALLOWED_ORIGINS: http://127.0.0.1:5173
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start the API
        working-directory: backend
        run: |
          export TRUSTKART_JWT_SECRET="$(openssl rand -base64 48)" # per run, never stored
          ./mvnw -B -ntp -q package -DskipTests
          nohup java -Xmx512m -jar target/trustkart-0.1.0-SNAPSHOT.jar > ../api.log 2>&1 &
      - name: Build and serve the frontend
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run build
          VITE_API_PROXY_TARGET=http://localhost:8080 nohup npx vite preview --host 127.0.0.1 --port 5173 --strictPort > ../web.log 2>&1 &
      - name: Wait for the API and the seeded catalog
        run: |
          for i in $(seq 1 90); do
            total=$(curl -sf "http://127.0.0.1:5173/api/v1/catalog/products?size=1" | python3 -c 'import json,sys; print(json.load(sys.stdin)["totalItems"])' 2>/dev/null || echo 0)
            [ "$total" -gt 2000 ] && echo "catalog ready: $total products" && exit 0
            sleep 2
          done
          echo "API never became ready"; tail -50 api.log; exit 1
      - name: Playwright
        working-directory: frontend
        env:
          CI: 'true'
          E2E_BASE_URL: http://127.0.0.1:5173
        run: npx playwright test --workers=2
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results
          path: |
            frontend/test-results
            api.log
            web.log

  images:
    name: Product image validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Every product has a real, attributed image
        run: python3 scripts/validate_images.py

  docker:
    name: Backend image builds
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Run gitleaks on full history
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --config /repo/.gitleaks.toml --redact --verbose

  dependency-review:
    name: Dependency review
    # Requires the dependency graph, which GitHub only provides free for public repositories.
    if: github.event_name == 'pull_request' && !github.event.repository.private
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
